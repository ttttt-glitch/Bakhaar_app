<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xisaabta Bakhaarka - Sales & Debt Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🛒 Xisaabta Bakhaarka</h1>
            <span id="current-date" class="text-xs bg-emerald-800 px-2 py-1 rounded"></span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Iibka Maanta (Sales)</p>
                <p id="total-sales" class="text-2xl font-bold text-emerald-600">0.00</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Deynta Maqan (Debt)</p>
                <p id="total-debt" class="text-2xl font-bold text-rose-600">0.00</p>
            </div>
        </div>

        <!-- Quick Actions Form -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-semibold text-slate-700 border-b pb-2">Diiwaangeli Wax Kala Ii/Deyn</h2>
            
            <form id="record-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nooca (Type)</label>
                    <select id="type" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="sale">Iib Caddaan ah (Cash Sale)</option>
                        <option value="debt">Deyn Cusub (New Credit/Debt)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Magaca Macmiilka / Alaabta</label>
                    <input type="text" id="description" placeholder="Tusaale: Shukumaan / Cali" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Lacagta (USD ama Sh.So)</label>
                    <input type="number" step="any" id="amount" placeholder="0.00" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2.5 rounded-lg transition text-sm">
                    Kaydi (Save)
                </button>
            </form>
        </div>

        <!-- Transaction Lists -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-semibold text-slate-700">Diiwaanka Dhaqdhaqaaqa</h2>
                <button onclick="clearData()" class="text-xs text-rose-500 hover:underline">Tirtir Wax walba</button>
            </div>
            
            <div id="transactions-list" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- Dynamic Items Go Here -->
                <p class="text-xs text-slate-400 text-center py-4">Wali wax xisaab ah lama gelin maanta.</p>
            </div>
        </div>

    </main>

    <script>
        // Set Date
        document.getElementById('current-date').innerText = new Date().toLocaleDateString();

        // State Management
        let transactions = JSON.parse(localStorage.getItem('bakhaar_transactions')) || [];

        const form = document.getElementById('record-form');
        const totalSalesEl = document.getElementById('total-sales');
        const totalDebtEl = document.getElementById('total-debt');
        const listEl = document.getElementById('transactions-list');

        function updateUI() {
            listEl.innerHTML = '';
            let salesTotal = 0;
            let debtTotal = 0;

            if (transactions.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Wali wax xisaab ah lama gelin.</p>`;
            }

            transactions.slice().reverse().forEach((tx, index) => {
                const originalIndex = transactions.length - 1 - index;
                if (tx.type === 'sale') salesTotal += parseFloat(tx.amount);
                if (tx.type === 'debt') debtTotal += parseFloat(tx.amount);

                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-2.5 rounded-lg border text-sm ${tx.type === 'sale' ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100'}`;
                
                item.innerHTML = `
                    <div>
                        <p class="font-medium text-slate-800">${tx.description}</p>
                        <span class="text-[10px] text-slate-500">${tx.time} • ${tx.type === 'sale' ? 'Iib' : 'Deyn'}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${tx.type === 'sale' ? 'text-emerald-600' : 'text-rose-600'}">$${parseFloat(tx.amount).toFixed(2)}</span>
                        <button onclick="deleteTx(${originalIndex})" class="text-slate-400 hover:text-rose-600 text-xs">✕</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            totalSalesEl.innerText = `$${salesTotal.toFixed(2)}`;
            totalDebtEl.innerText = `$${debtTotal.toFixed(2)}`;
            localStorage.setItem('bakhaar_transactions', JSON.stringify(transactions));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            transactions.push({ type, description, amount, time });
            form.reset();
            updateUI();
        });

        function deleteTx(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        function clearData() {
            if(confirm("Ma hubtaa inaad tirtirto dhammaan xisaabta?")) {
                transactions = [];
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
